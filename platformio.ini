; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sonde-eth-io

; Tests unitaires natifs (protocole UDP et logique de securite, sans Arduino) :
;   pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=gnu++17 -Wall -Wextra
build_src_filter = -<*> +<udp_proto.cpp> +<udp_safety.cpp>

; Variantes de firmware (voir VARIANTS.md). OTA uniquement : jamais de flash serie en production.
; io-devicenet-eth-24v : carte 24 V (moteur DM556 + MCP23017), MQTT + UDP. Equivaut a l'ancien env wt32-eth01
; (base motor-24v-io) avec la liaison UDP active par defaut de configuration.
[env:io-devicenet-eth-24v]
platform = espressif32
board = wt32-eth01
framework = arduino
;set serial monitor speed
upload_port = COM3
monitor_speed = 115200
lib_compat_mode = soft
lib_ldf_mode = deep
build_flags = 
  -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
  -DCORE_DEBUG_LEVEL=3
  -DFW_VARIANT=\"io-devicenet-eth-24v\"
  -DFW_NET_ETH=1
  -DFW_IO_SIMPLE=0
  -DFW_IO_24V=1
  -DFW_UDP_DEFAULT_ENABLED=1
  -DFW_MQTT=1
extra_scripts = pre:tools/fw_version.py
lib_deps = 
  https://github.com/me-no-dev/ESPAsyncWebServer.git
  https://github.com/me-no-dev/AsyncTCP.git
  bblanchon/ArduinoJson@^7.0.4
  knolleary/PubSubClient@^2.8
  https://github.com/tzapu/WiFiManager.git
  https://github.com/ayushsharma82/ElegantOTA.git
  arduino-libraries/NTPClient@^3.2.1


; sonde-touch (E/S simples, WT32-ETH01) : moteur et MCP23017 absents (GPIO 4/14/15/32/33 libres),
; UDP actif par defaut (cle fournie a l'execution), MQTT compile et actif en repli (desactivable a l'execution).
[env:sonde-eth-io]
extends = env:io-devicenet-eth-24v
build_flags = 
  -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
  -DCORE_DEBUG_LEVEL=3
  -DFW_VARIANT=\"sonde-eth-io\"
  -DFW_NET_ETH=1
  -DFW_IO_SIMPLE=1
  -DFW_IO_24V=0
  -DFW_UDP_DEFAULT_ENABLED=1
  -DFW_MQTT=1

; Meme sonde, UDP seul : MQTT non compile (aucune connexion au broker).
[env:sonde-eth-io-udp-seul]
extends = env:sonde-eth-io
build_flags = 
  -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
  -DCORE_DEBUG_LEVEL=3
  -DFW_VARIANT=\"sonde-eth-io-udp-seul\"
  -DFW_NET_ETH=1
  -DFW_IO_SIMPLE=1
  -DFW_IO_24V=0
  -DFW_UDP_DEFAULT_ENABLED=1
  -DFW_MQTT=0
